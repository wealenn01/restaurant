services:
  db:
    image: postgres:16-alpine
    container_name: restaurant_db
    restart: unless-stopped
    env_file:
      - ./bot_yapis/.env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-restaurant_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-restaurant_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./bot_yapis
      dockerfile: Dockerfile
    container_name: restaurant_api
    restart: unless-stopped
    env_file:
      - ./bot_yapis/.env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  web:
    image: nginx:alpine
    container_name: restaurant_web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
